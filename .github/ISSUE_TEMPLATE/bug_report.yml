name: "🐛 Bug report"
description: "Report something in Axe Miners Monitor that is not working correctly"
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Please provide as much information as possible so the problem can be reproduced and diagnosed.

        **This issue is public. Never post passwords, wallet private keys, seed phrases, API credentials, tokens, public IP addresses, or other sensitive information.**

  - type: input
    id: app-version
    attributes:
      label: Axe Miners Monitor version
      description: "You can find the app version in the app's About screen or Android app information."
      placeholder: "e.g. 1.1.2"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: "e.g. Android 16"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Phone / tablet model
      placeholder: "e.g. Google Pixel 8 Pro"
    validations:
      required: true

  - type: input
    id: miner-model
    attributes:
      label: Miner model
      description: "If the issue is miner-specific, tell us which AxeOS device is affected."
      placeholder: "e.g. Bitaxe Gamma 601, Bitaxe 801"
    validations:
      required: false

  - type: input
    id: axeos-version
    attributes:
      label: AxeOS version
      placeholder: "e.g. v2.x.x"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: "Describe the problem clearly."
      placeholder: "Tell us what went wrong."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "List the exact steps that reproduce the issue, if known."
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Go to ...
        4. The problem appears
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots, logs or additional context
      description: "Add screenshots or relevant logs if useful. Remove any sensitive information before posting."
      placeholder: "Drag screenshots here or paste additional details."
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: "I searched existing issues and did not find the same problem."
          required: true
        - label: "I have removed passwords, wallet secrets, credentials, IP addresses and other sensitive information from this report."
          required: true
